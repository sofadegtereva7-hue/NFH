<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nfh</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>nfh</h1>

    <p class="intro">
      a public message board
    </p>

    <section class="message-form">
      <h2>Leave a message</h2>

      <label for="author">Name</label>
      <input id="author" type="text" maxlength="80" placeholder="Your name">

      <label for="message">Message</label>
      <textarea id="message" maxlength="2000" placeholder="Write something..."></textarea>

      <button id="send">Post message</button>

      <p id="status"></p>
    </section>

    <section>
      <h2>Messages</h2>
      <div id="messages">
        <p>Loading...</p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
